<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedFlow Clinic Log in</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="all.min.css">
  <!-- Theme style -->
  <link rel="stylesheet" href="adminlte.min.css">
</head>

<body>
<section class="content pt-5">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card card-outline card-primary">
          <div class="card-header text-center">
            <p style="font-size: 35px; font-weight: bold;">MedFlow Clinic </p> 
          </div>
          <div class="card-body">
            <p class="login-box-msg">Sign in to clinic portal</p>

            <form action="index.html" method="get">
              <div class="input-group mb-3">
                <input type="email" class="form-control" placeholder="Clinic Email" required>
                <div class="input-group-append">
                  <div class="input-group-text">
                    <span class="fas fa-envelope"></span>
                  </div>
                </div>
              </div>
              <div class="input-group mb-3">
                <input type="password" class="form-control" placeholder="Password" required>
                <div class="input-group-append">
                  <div class="input-group-text">
                    <span class="fas fa-lock"></span>
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-8">
                  <div class="icheck-primary">
                    <input type="checkbox" id="remember">
                    <label for="remember">
                      Remember Me
                    </label>
                  </div>
                </div>
                <div class="col-4">
                  <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                </div>
              </div>
            </form>

            <p class="mb-1">
              <a href="forgot-password.html">I forgot my password</a>
            </p>
            <p class="mb-0">
              <a href="register.html" class="text-center">Register a new membership</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script src="jquery.min.js"></script>
<script src="bootstrap.bundle.min.js"></script>
<script src="adminlte.min.js"></script>
<script src="jquery.min.js"></script>
<script src="bootstrap.bundle.min.js"></script>
<script src="adminlte.min.js"></script>
<script>
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-widget="pushmenu"]');
    if (!btn) return;
    e.preventDefault();
    if (window.$ && $.fn && $.fn.PushMenu) {
      $(btn).PushMenu('toggle');
    } else {
      var body = document.body;
      if (window.innerWidth < 992) {
        body.classList.toggle('sidebar-open');
        body.classList.remove('sidebar-collapse');
      } else {
        body.classList.toggle('sidebar-collapse');
        body.classList.remove('sidebar-open');
      }
    }
  });
</script>
</body>
</html>
