<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedFlow Clinic Forgot Password</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="all.min.css">
  <!-- Theme style -->
  <link rel="stylesheet" href="adminlte.min.css">
</head>

<body>
<section class="content pt-5">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card card-outline card-primary">
          <div class="card-header text-center">
            <p style="font-size: 35px; font-weight: bold;">MedFlow Clinic </p> 
          </div>
          <div class="card-body">
            <div id="requestForm">
              <p class="login-box-msg">Verify your email to reset your password</p>

              <form id="forgotForm">
                <div class="input-group mb-3">
                  <input type="email" id="email" class="form-control" placeholder="Clinic Email" required autocomplete="email">
                  <div class="input-group-append">
                    <div class="input-group-text">
                      <span class="fas fa-envelope"></span>
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-12">
                    <button type="submit" class="btn btn-primary btn-block" id="sendBtn">
                      <i class="fas fa-paper-plane mr-1"></i> Send Reset Link
                    </button>
                  </div>
                </div>
              </form>

              <p class="mb-1 mt-3">
                <a href="login.html">Back to sign in</a>
              </p>
              <p class="mb-0">
                <a href="register.html" class="text-center">Register a new membership</a>
              </p>
            </div>

            <!-- ========================================== -->
            <!-- SUCCESS STATE (Hidden initially)           -->
            <!-- ========================================== -->
            <div id="successState" style="display: none;">
              <div class="text-center mb-3">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-light p-3" style="width: 70px; height: 70px;">
                  <i class="fas fa-check text-success" style="font-size: 2rem;"></i>
                </div>
              </div>
              <h4 class="text-center mb-2" style="color: #0b2b4b;">Check your inbox</h4>
              <p class="text-center text-muted mb-4">
                We've sent a password reset link to
                <strong id="displayEmail" class="text-primary">your email</strong>.
                Please check your email (and spam folder).
              </p>

              <div class="row mb-2">
                <div class="col-12">
                  <button class="btn btn-primary btn-block" id="resendBtn">
                    <i class="fas fa-redo-alt mr-1"></i> Resend Link
                  </button>
                </div>
              </div>

              <p class="mb-1 mt-3 text-center">
                <a href="#" id="backToFormLink"> Use a different email</a>
              </p>
              <p class="mb-0 text-center">
                <a href="login.html">Back to sign in</a>
              </p>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- REQUIRED SCRIPTS (same as your other pages) -->
<script src="jquery.min.js"></script>
<script src="bootstrap.bundle.min.js"></script>
<script src="adminlte.min.js"></script>

<script>
  $(function () {
    const $requestForm   = $('#requestForm');
    const $successState  = $('#successState');
    const $emailInput    = $('#email');
    const $displayEmail  = $('#displayEmail');
    const $sendBtn       = $('#sendBtn');
    const $resendBtn     = $('#resendBtn');
    const $backToForm    = $('#backToFormLink');

    // Store the email used for the reset request
    let currentEmail = '';

    // Helper: show success view
    function showSuccess(email) {
      currentEmail = email || currentEmail || 'your email';
      $displayEmail.text(currentEmail);
      $requestForm.hide();
      $successState.show();
    }

    // Helper: show request form again
    function showRequestForm() {
      $successState.hide();
      $requestForm.show();
      if (currentEmail) {
        $emailInput.val(currentEmail);
      }
      $emailInput.trigger('focus');
    }

    // ---- Handle the "Send Reset Link" form ----
    $('#forgotForm').on('submit', function (e) {
      e.preventDefault();

      const email = $emailInput.val().trim();

      // Basic client-side validation
      if (!email) {
        alert('Please enter your email address.');
        return;
      }
      if (!email.includes('@') || !email.includes('.')) {
        alert('Please enter a valid email address.');
        return;
      }

      currentEmail = email;

      // Simulate network request (replace with actual AJAX call if needed)
      // Example AJAX:
      /*
      $.ajax({
        url: '/api/forgot-password',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ email: email }),
        success: function () { showSuccess(email); },
        error: function (xhr) {
          var msg = xhr.responseJSON ? xhr.responseJSON.error : 'Could not reach the server.';
          alert(msg);
        }
      });
      */

      // Demo: disable button briefly, then show success
      $sendBtn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-1"></i> Sending...');

      setTimeout(function () {
        $sendBtn.prop('disabled', false).html('<i class="fas fa-paper-plane mr-1"></i> Send Reset Link');
        showSuccess(email);
      }, 500); // 500ms delay for visual feedback
    });

    // ---- Handle "Resend Link" button ----
    $resendBtn.on('click', function () {
      const originalHtml = $resendBtn.html();
      $resendBtn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-1"></i> Resending...');

      // Demo: simulate resend (replace with actual AJAX call)
      setTimeout(function () {
        $resendBtn.prop('disabled', false).html(originalHtml);
        alert('A new reset link has been sent to ' + (currentEmail || 'your email') + '.');
      }, 700);
    });

    // ---- "Use a different email" link ----
    $backToForm.on('click', function (e) {
      e.preventDefault();
      showRequestForm();
    });

    // Optional: focus email field on load
    $emailInput.trigger('focus');
  });
</script>
</body>
</html>
