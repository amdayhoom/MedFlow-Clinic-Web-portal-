      <li class="nav-item">
        <a class="nav-link" data-widget="navbar-search" href="#" role="button">

      <li class="nav-item">

    </ul>

  <!-- Main Sidebar Container -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <li class="nav-item">

              <i class="nav-icon fas fa-home"></i>

            </a>
          </li>

              <i class="nav-icon fas fa-plus"></i>
              <p>Add</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="list.html" class="nav-link">
              <i class="nav-icon fas fa-list"></i>
              <p>List</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="profile.html" class="nav-link">
              <i class="nav-icon fas fa-user"></i>

            </a>
          </li>
          <li class="nav-item">
            <a href="login.html" class="nav-link">

            </a>
          </li>
        </ul>
      </nav>
    </div>

  <div class="content-wrapper">
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Add Form Sections</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item active">Add Form Sections</li>
            </ol>
          </div>
        </div>
      </div>
    </section>

    <section class="content">
      <div class="container-fluid">
        <form>
          <div class="row">

            <div class="col-md-6">
              <div class="card card-primary">
                <div class="card-header">
                  <h3 class="card-title">1. Personal Details</h3>
                </div>
                <div class="card-body">
                  <div class="form-group">
                    <label for="inputText">Full Name</label>
                    <input type="text" class="form-control" id="inputText" placeholder="Enter patient full name">
                  </div>
                  <div class="form-group">
                    <label for="inputEmail">Email Address</label>
                    <input type="email" class="form-control" id="inputEmail" placeholder="Enter email address">
                  </div>
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="card card-info">
                <div class="card-header">
                  <h3 class="card-title">2. Age & Appointment Date</h3>
                </div>
                <div class="card-body">
                  <div class="form-group">
                    <label for="inputNumber">Age / Phone Number</label>
                    <input type="number" class="form-control" id="inputNumber" placeholder="Enter number">
                  </div>
                  <div class="form-group">
                    <label for="inputDate">Appointment Date</label>
                    <input type="date" class="form-control" id="inputDate">
                  </div>
                </div>
              </div>
            </div>

          </div>

          <div class="row">

            <div class="col-md-6">
              <div class="card card-success">
                <div class="card-header">
                  <h3 class="card-title">3. Department & Medical Notes</h3>
                </div>
                <div class="card-body">
                  <div class="form-group">
                    <label>Clinic Department</label>
                    <select class="form-control">
                      <option>Cardiology</option>
                      <option>Pediatrics</option>
                      <option>Orthopedics</option>
                      <option>Dermatology</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label>Medical History / Symptoms</label>
                    <textarea class="form-control" rows="3" placeholder="Enter medical notes..."></textarea>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="card card-warning">
                <div class="card-header">
                  <h3 class="card-title">4. Gender & Report Upload</h3>
                </div>
                <div class="card-body">
                  <div class="form-group">
                    <label>Gender</label>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="radioGroup" id="radio1" checked>
                      <label class="form-check-label" for="radio1">Male</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="radioGroup" id="radio2">
                      <label class="form-check-label" for="radio2">Female</label>
                    </div>
                  </div>

                  <div class="form-group">
                    <label>Insurance Coverage</label>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="check1">
                      <label class="form-check-label" for="check1">Insured Patient</label>
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="exampleInputFile">Medical Report File</label>
                    <div class="input-group">
                      <div class="custom-file">
                        <input type="file" class="custom-file-input" id="exampleInputFile">
                        <label class="custom-file-label" for="exampleInputFile">Choose file</label>
                      </div>
                      <div class="input-group-append">
                        <span class="input-group-text">Upload</span>
                      </div>
                    </div>
                  </div>

                </div>
              </div>
            </div>

          </div>

          <div class="row">
            <div class="col-md-12">
              <div class="card">
                <div class="card-footer">
                  <button type="submit" class="btn btn-primary">Save</button>
                  <button type="button" class="btn btn-default float-right">Cancel</button>
                </div>
              </div>
            </div>
          </div>

        </form>
      </div>
    </section>
  </div>

$(function () {
  if (typeof bsCustomFileInput !== 'undefined') {
    bsCustomFileInput.init();
  }
});
</script>
</body>
</html>
